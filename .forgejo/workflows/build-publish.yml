# Tests, then publishes the steam-mcp image to Forgejo OCI on every push to
# main. No deploy stage here: rollout is driven from
# coilyco-bridge/deploy/services/steam-mcp per the layer invariant
# (source -> deploy). The repo is steam-ops, but the image is steam-mcp.
name: build-publish

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v4
      - run: just test
      - run: just lint

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
        run: python3 scripts/alert-telegram.py
  publish:
    runs-on: deploy
    needs: [test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Publish immutable image
        run: bash scripts/publish-image.sh
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
        run: python3 scripts/alert-telegram.py
