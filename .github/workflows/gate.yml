# The org ruleset's required check (COI-3297): a job named `gate`, on PRs and main pushes.
# Runs the test and lint steps of build-publish.yml without publishing. No secrets.
name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: coilyco/agentic-os/actions/setup-ci@df1aee7cf7fd1c36c1eda3523291a76b0cdbbd35
        with:
          tools: just uv
      - run: just test
      - run: just lint
