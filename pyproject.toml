[project]
name = "steam-mcp"
version = "0.1.0"
description = "Read-only MCP exposing Kai's Steam library (owned games, recently played) over streamable-HTTP, backed by the Steam Web API."
readme = "README.md"
# steamio 1.1.3's Python 3.14 branch imports compression.zstandard, which
# Python 3.14 does not provide. Keep bootstrap and production on Python 3.13.
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Kai Ase Siren" }]
dependencies = [
  # steamio 1.1.3 imports AsyncStreamReaderMixin from aiohttp.streams.
  # aiohttp 3.14 removed that private compatibility surface.
  "aiohttp<3.14",
  # steamio's current client-protocol release pins this pre-release transport.
  # Declaring it directly permits uv to resolve the package's intentional pin.
  "betterproto==2.0.0b6",
  # The server uses the official SDK's v1 FastMCP API. MCP v2 removes that
  # module, so keep both local and unpinned container installs on v1.
  "mcp>=1.27,<2",
  "requests>=2.32.0",
  "steamio>=1.1.3",
  # Crash reporting only (teable:coilyco/deploy#8409). Off unless SENTRY_DSN is set.
  "sentry-sdk>=2.0,<3",
]

[project.scripts]
steam-mcp = "steam_mcp.__main__:main"

[tool.uv]
managed = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steam_mcp"]

[tool.ruff]
line-length = 100
target-version = "py313"
# The clipboard scrape is superseded legacy data, kept in place untouched (it
# predates this repo's lint config and uses single-char loop vars). New work
# lives under src/ + tests/, which the CLI lint scopes to anyway.
extend-exclude = ["steam_games_to_yaml.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "RUF"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "steam_mcp.server"
# FastMCP's tool() decorator is untyped; registering through it trips
# no-untyped-call under strict mode. The tool bodies themselves stay typed.
disable_error_code = ["no-untyped-call"]

[dependency-groups]
dev = [
  "mypy>=1.20.0",
  "pre-commit>=4.5.1",
  "ruff>=0.15.10",
  "pytest>=8.0.0",
  "types-requests>=2.32.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Per-repo opt-outs for agentic-os pre-commit hooks (agentic_os/config.py).

[tool.agentic-os.code-comments]
# The agentic-os managed block injects BEGIN/END marker comments below the
# `repos:` content line; they are machine-managed by apply-agentic-os-hooks.py
# and cannot move to a top header. Same exclusion the deploy repo and agentic-os
# itself carry.
excludes = [
    ".pre-commit-config.yaml",
]

[tool.agentic-os.repo-pointer-skills]
# This repo lives under the coilyco-gaming org dir.
org = "coilyco"

[tool.agentic-os.documentation-layout]
band = "small"
